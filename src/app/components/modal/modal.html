@if (isOpen) {
  <div
    class="modal-backdrop"
    role="presentation"
    (click)="onBackdropClick($event)"
  >
    <section
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-label="Ventana modal"
    >
      <button
        class="close-button"
        type="button"
        aria-label="Cerrar modal"
        (click)="close()"
      >
        &times;
      </button>

      <ng-content />
    </section>
  </div>
}
